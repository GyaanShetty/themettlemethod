article: |
  Your circle of competence is the set of topics you genuinely understand: you know the basics,
  the exceptions, and where experts disagree. Outside it, you can still have opinions, but you
  are guessing.

  Warren Buffett described it in his 1996 letter to Berkshire Hathaway shareholders: investors
  don't need to be experts on everything, only able to evaluate companies within their circle.
  "The size of that circle is not very important; knowing its boundaries, however, is vital."

  ## Signs you're outside your circle

  - You can repeat conclusions but not explain why they're true.
  - You don't know what the strongest counter-argument is.
  - You have never been wrong in this area, because you have never been tested in it.

  ## How to use it

  1. List the three areas where you make the most important decisions.
  2. For each, mark it as inside, at the edge, or outside your circle.
  3. Outside: borrow someone else's circle (an expert, a mentor) or go slower.
  4. At the edge: that's where deliberate learning grows the circle.

