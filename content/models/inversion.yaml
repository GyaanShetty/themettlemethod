caption: |
  Inversion: instead of asking how to win, ask how you'd lose, then avoid it.
  Mathematician Carl Jacobi's advice was "invert, always invert". Charlie Munger made it famous in investing.
  Try it today: write down 3 ways your current goal could fail.
tags: [mentalmodels, inversion, charliemunger, decisionmaking, thinking, selfimprovement]

article: |
  Most people attack a problem head-on: *how do I make this work?* Inversion flips the question:
  *what would make this fail?* Failure modes are usually easier to see than paths to success,
  and avoiding them gets you most of the way there.

  The idea is often traced to the mathematician Carl Jacobi, who advised "invert, always invert".
  Charlie Munger brought it to investing and business, arguing that a lot of long-term advantage
  comes from trying to be consistently not stupid rather than trying to be very intelligent.

  ## How to use it

  1. State your goal plainly.
  2. Ask: what would guarantee the opposite outcome?
  3. List 3 to 5 concrete failure modes.
  4. Turn each into a rule you won't break.

  ## Example

  Goal: a healthy relationship. Inverted: what destroys one? Keeping score, never apologising,
  going silent instead of talking. You now have three things to avoid, which is easier
  than chasing a vague ideal.

sources:
