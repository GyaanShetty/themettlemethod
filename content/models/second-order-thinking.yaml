caption: |
  Second-order thinking: don't stop at the first consequence. Ask "and then what?"
  The cobra effect is the classic warning: reward dead cobras and people start farming them.
  Before your next big decision, write down what happens next, then what, and who reacts.
tags: [mentalmodels, secondorderthinking, decisionmaking, thinking, criticalthinking, selfimprovement]

article: |
  First-order thinking asks what happens right now. Second-order thinking asks what happens next,
  and after that. Most mistakes come from stopping at the first, pleasant consequence.

  The ecologist Garrett Hardin summed it up as "you can never do merely one thing": every action
  sets off effects beyond the one you intended. Investor Howard Marks makes a similar point with
  "second-level thinking", the habit of asking what everyone else expects and what happens after.

  ## The cobra effect

  The story goes that British-ruled Delhi offered a bounty for dead cobras. It worked at first.
  Then people bred cobras for the reward, the bounty was cancelled, and the farmed snakes were
  released. The first-order result (fewer cobras) hid the second-order one (more cobras).
  Historians doubt the details, but the pattern shows up in real policy all the time.

  ## How to use it

  1. Write the decision and its obvious result.
  2. Ask "and then what?" at least twice.
  3. Ask who else is affected and how they will change their behaviour.
  4. Look for effects that arrive late, like habits, incentives and reputation.

