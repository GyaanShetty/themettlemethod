slug: compound-interest
title: Compound interest
category: Economics
publish_on: 2026-11-03
summary: Growth on top of growth. Why small, steady gains beat big, rare ones.

article: |
  Compound interest is what happens when the returns on something start earning returns of their own.
  Put ₹10,000 in an account paying 10% a year. After year one you have ₹11,000. In year two you earn
  10% on ₹11,000, not on the original ₹10,000, so you end with ₹12,100. The extra ₹100 is interest on interest,
  and that extra keeps getting bigger every year.

  ## Why it surprises people

  Our intuition is linear: we expect ten years to give ten times one year's gain. Compounding is
  exponential. At 10% a year, money roughly doubles every 7 years, so it is about 2× after 7 years, 4×
  after 14 and 8× after 21. Most of the growth arrives at the end, which is why starting early matters
  more than starting big.

  ## The rule of 72

  A quick way to estimate doubling time: divide 72 by the yearly growth rate in percent.
  At 6% a year, money doubles in about 12 years. At 12%, about 6.

  ## Beyond money

  The same maths applies to anything that builds on itself: skills, reputation, relationships, code
  quality. Getting 1% better at something each day is barely noticeable for weeks, then very noticeable
  for years. It works in reverse too. Debt, bad habits and technical debt compound against you.

  ## Try it

  Pick one skill you could practise for 15 minutes a day. Estimate where you'd be after 100 days, then
  after a year. The gap between those two numbers is compounding.

