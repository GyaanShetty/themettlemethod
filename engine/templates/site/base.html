<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ title }}"><meta property="og:description" content="{{ description }}">
<meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="{{ b.name }}" href="{{ root }}/feed.xml">
<style>
  @font-face { font-family: Marcellus; src: url('{{ root }}/fonts/marcellus-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Marcellus SC'; src: url('{{ root }}/fonts/marcellus-sc-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('{{ root }}/fonts/hanken-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('{{ root }}/fonts/hanken-grotesk-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  :root { --bg: {{ b.colors.bg }}; --surface: {{ b.colors.surface }}; --ink: {{ b.colors.ink }}; --muted: {{ b.colors.muted }}; --accent: {{ b.colors.accent }};
          --line: color-mix(in srgb, var(--muted) 22%, transparent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 18px/1.65 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header.top { border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
  .logo { font: 400 22px/1 Marcellus, Georgia, serif; text-decoration: none; letter-spacing: -.01em; }
  nav a { margin-left: 22px; font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--ink); }
  h1, h2, h3 { font-family: Marcellus, Georgia, serif; font-weight: 400; letter-spacing: -.015em; line-height: 1.08; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .muted { color: var(--muted); }
  main { padding: 56px 0 96px; }
  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; font-size: 14px; color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .btn { display: inline-block; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 15px; padding: 11px 20px;
         border-radius: 0; text-decoration: none; }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  @media (max-width: 560px) { body { font-size: 17px; } nav a { margin-left: 14px; } }
</style>
{% block head %}{% endblock %}
</head><body>
<header class="top"><div class="wrap">
  <a class="logo" href="{{ root }}/">{{ b.name }}</a>
  <nav>{% for label, href in nav %}<a href="{{ href }}">{{ label }}</a>{% endfor %}</nav>
</div></header>
<main><div class="wrap">{% block main %}{% endblock %}</div></main>
<footer><div class="wrap">
  <span>© {{ year }} {{ b.name }} · {{ b.tagline }}</span>
  <span>{{ b.handle }} on Instagram and YouTube · <a href="{{ root }}/feed.xml">RSS</a></span>
</div></footer>
</body></html>
