<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face { font-family: Fraunces; src: url('{{ fonts }}/Fraunces-SOFT-WONK-opsz-wght.ttf'); font-weight: 100 900; }
  @font-face { font-family: Inter; src: url('{{ fonts }}/Inter-opsz-wght.ttf'); font-weight: 100 900; }
  :root { --bg: {{ c.bg }}; --surface: {{ c.surface }}; --ink: {{ c.ink }}; --muted: {{ c.muted }}; --accent: {{ c.accent }}; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; color: var(--ink); font-family: Inter, sans-serif; position: relative;
         background: radial-gradient(700px 600px at 88% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%), var(--bg); }
  .l { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .k { font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  h1 { font: 600 {{ size }}px/1.02 Fraunces, Georgia, serif; letter-spacing: -.015em; }
  p { font-size: 22px; line-height: 1.45; color: var(--muted); margin-top: 22px; max-width: 500px; }
  .brand { position: absolute; left: 72px; bottom: 44px; font: 600 18px Fraunces, serif; color: var(--muted); }
  .win { position: absolute; right: 64px; top: 96px; width: 520px; background: var(--surface); border-radius: 18px; overflow: hidden;
         border: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); box-shadow: 0 40px 90px -30px #000; transform: rotate(1.2deg); }
  .bar { height: 38px; display: flex; gap: 7px; align-items: center; padding: 0 14px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 18%, transparent); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 40%, transparent); }
  .pg { padding: 24px 28px 28px; }
  .pt { font: 600 25px Fraunces, serif; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 8px; font-size: 17px; }
  .row:nth-child(odd) { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .row span { width: 24px; text-align: center; color: var(--accent); }
  .row em { margin-left: auto; font-style: normal; font-size: 14px; color: var(--muted); }
</style></head><body>
<div class="l">
  <div class="k">{{ 'Notion template' if spec.type == 'notion' else 'Printable card deck' }}</div>
  <h1>{{ headline }}</h1>
  <p>{{ spec.tagline }}</p>
</div>
<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="pg">
  <div class="pt"><span>{{ spec.icon }}</span>{{ headline }}</div>
  {% for icon, name, note in items %}<div class="row"><span>{{ icon }}</span>{{ name }}<em>{{ note }}</em></div>{% endfor %}
</div></div>
<div class="brand">{{ b.name }}</div>
</body></html>
