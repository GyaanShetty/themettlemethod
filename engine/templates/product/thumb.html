<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face { font-family: Marcellus; src: url('{{ fonts }}/marcellus-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Marcellus SC'; src: url('{{ fonts }}/marcellus-sc-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('{{ fonts }}/hanken-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('{{ fonts }}/hanken-grotesk-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 600px; height: 600px; background: {{ c.bg }}; color: {{ c.ink }}; font-family: 'Hanken Grotesk', sans-serif; position: relative;
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px; overflow: hidden; }
  body::before { content: ""; position: absolute; inset: 22px; border: 2px solid color-mix(in srgb, {{ c.accent }} 45%, transparent); border-radius: 0; }
  .i { font-size: 110px; line-height: 1; }
  h1 { font: 400 {{ (size * 0.66)|int }}px/1.05 Marcellus, Georgia, serif; margin-top: 24px; }
  .k { margin-top: 18px; font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: {{ c.accent }}; }
</style></head><body><div class="i">{{ spec.icon }}</div><h1>{{ headline }}</h1>
<div class="k">{{ 'Notion template' if spec.type == 'notion' else 'Card deck' }}</div></body></html>
