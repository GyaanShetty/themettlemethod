name: Daily

# 06:15 IST every day: render whatever is due and send it to every channel.
# It is a dry run until the owner turns on publish_live in the War Room settings.
# Run by hand with an atom id to send one on purpose.
on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      atom:
        description: Send this atom now (leave empty for whatever is due)
        required: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ATOM: ${{ inputs.atom }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Render and publish
        id: run
        run: |
          set -uo pipefail
          python -m engine validate
          python -m engine connections
          args=""
          if [ -n "${ATOM:-}" ]; then
            [[ "$ATOM" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "bad atom id"; exit 1; }
            args="--atom $ATOM"
          fi
          status=0
          python -m engine daily $args | tee /tmp/daily.log || status=$?
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "engine"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -qm "Record what was posted" && git pull -q --rebase && git push -q || true
          fi
          exit $status

      - name: Tell the owner when a publish fails
        if: failure()
        run: |
          { echo "The daily run failed. Nothing was posted twice; re-run the workflow once the cause is fixed."; echo; echo '```'; tail -30 /tmp/daily.log 2>/dev/null; echo '```'; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > /tmp/body.md
          gh label create publish-failed --color 7A2420 --description "A daily publish failed" --force
          gh issue create --title "Publish failed on $(date -u +%F)" --label publish-failed --assignee "$GITHUB_REPOSITORY_OWNER" --body-file /tmp/body.md

      - name: Keep the renders for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ github.run_number }}
          path: |
            build/reels/*.mp4
            build/social/**/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Refresh website
        if: always()
        run: gh workflow run site.yml
