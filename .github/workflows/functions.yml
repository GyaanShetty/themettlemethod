name: Edge Functions

# Deploys every function under supabase/functions when they change on main.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zcdszmvktizxydwgehsr
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::warning::Not connected: set SUPABASE_ACCESS_TOKEN (see docs/SECRETS.md)."; exit 0; fi
          # Webhooks and cron jobs check their own secrets; the admin functions check the admins table.
          for fn in payments-webhook nightly ingest-metrics; do
            [ -d "supabase/functions/$fn" ] && supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
          for fn in circle-assign admin; do
            [ -d "supabase/functions/$fn" ] && supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
