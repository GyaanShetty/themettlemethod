name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. Refresh monthly and store the new one.
# Needs GH_ADMIN_TOKEN: a fine-grained personal access token for this repo with "Secrets: read and write".
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          new="$(python -c 'from engine.publish import refresh_instagram_token as r; print(r())')"
          echo "::add-mask::$new"
          printf '%s' "$new" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Instagram token refreshed."
