name: Voice
on:
  workflow_dispatch:
  push:
    paths: [film/narration.txt]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          mkdir -p out; i=0
          while IFS= read -r l; do i=$((i+1)); [ -z "$l" ] && continue
            edge-tts --voice en-GB-RyanNeural --rate=-18% --pitch=-14Hz --text "$l" --write-media out/$(printf %02d $i).mp3
          done < film/narration.txt
      - run: |
          git config user.name GyaanShetty; git config user.email gyaanshetty@gmail.com
          git checkout --orphan voice-out; git rm -rqf .; git add out; git commit -qm narration; git push -f origin voice-out
